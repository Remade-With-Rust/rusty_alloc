name: ci
on:
  push:
    branches: [main]
    # A release tag runs the Kani proofs (see the `proofs` job). v1.1.0 shipped
    # with a proof that had been broken by an unrelated optimisation, because
    # nothing verified them at release time and the weekly cron below had never
    # actually fired.
    tags: ["v*"]
  pull_request:
  # Weekly advisory sweep (H-40): cargo-audit re-checks the RustSec feed even
  # when nothing is being merged. The same trigger runs the Kani proofs, which
  # are too slow to block every PR.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least-privilege token (H-37): nothing in this workflow writes to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are SHA-pinned (H-37): a moved tag must not change what CI runs.
# checkout 11d5960a = v4.2.2 · rust-toolchain 6c977a6c = master 2026-07 ·
# setup-node 49933ea5 = v4.4.0. Bump deliberately, with the SHA.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: check (no features)
        run: cargo check --workspace --all-targets
      - name: test (all features)
        run: cargo test --workspace --all-features

  # H-06/H-08/H-09: the supply-chain gate — policy (deny) + advisories (audit)
  # on every PR, tools version-pinned so the gate itself is reproducible.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: install cargo-deny + cargo-audit + cargo-vet (pinned)
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-vet --version 0.10.2 --locked
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit --deny warnings
      # H-10: every SHIPPING dependency carries an audit certification; the
      # remaining exemptions are dev-only and pinned at safe-to-run, so this
      # fails the moment one of them becomes a runtime dependency.
      - name: cargo vet
        run: cargo vet --locked

  # H-22: static analysis BEYOND clippy. The rules in tools/semgrep-rules.yml
  # are written from this crate's own incident history (docs/LEDGER.md) — a
  # generic ruleset would find none of them. Their first run found a real
  # latent defect: `remove_huge_segment` still had the release-compiled-out
  # `debug_assert!(false, ..)` shape that caused the 0.4.0 dangling-list
  # crash on the normal-segment path.
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install semgrep (pinned)
        run: pipx install semgrep==1.173.0 || pip install --user semgrep==1.173.0
      - name: semgrep (repo-specific rules)
        run: semgrep --config tools/semgrep-rules.yml --error --quiet
      # The rules must be able to FAIL, or they are decoration. This asserts
      # they still fire on the bad shapes they exist to catch.
      - name: prove the rules are not vacuous
        run: bash tools/semgrep-selftest.sh
      # H-11: the unsafe ratchet. Growth is allowed but must be deliberate —
      # documented in UNSAFE.md and re-baselined in the same commit.
      - name: unsafe census ratchet
        run: bash tools/unsafe-census.sh

  # H-30: the proofs must keep proving. Kani is slow, so this runs on a
  # schedule and on demand rather than blocking every PR — the harnesses
  # cover arithmetic that changes rarely, and a regression there would also
  # trip the property tests and Miri long before a release.
  proofs:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: install kani (pinned)
        run: cargo install --locked kani-verifier --version 0.67.0 && cargo kani setup
      # --ignore-global-asm: Kani cannot analyse the crate's `global_asm!`
      # (the initial-exec TLS slot). None of these harnesses touch that code —
      # they prove pure index/size arithmetic — so the exclusion does not
      # weaken them, but it is stated rather than hidden.
      - name: cargo kani
        run: cargo kani -p rusty_alloc -Z unstable-options --ignore-global-asm

  # H-26/H-27: the fuzz targets must BUILD and survive a short libFuzzer run
  # on every PR (the long soak runs on its own schedule; this catches a
  # target that rotted or a crasher that reproduces instantly).
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - name: install cargo-fuzz (pinned)
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: fuzz alloc_ops (smoke)
        run: cargo +nightly fuzz run alloc_ops -- -max_total_time=60
      - name: fuzz xthread (smoke)
        run: cargo +nightly fuzz run xthread -- -max_total_time=60

  # The compile-gate rule: both tier-1 targets checked even where they don't run.
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - name: check windows target from linux
        run: cargo check --workspace --target x86_64-pc-windows-msvc

  # G4: the os-layer logic must stay UB-free under miri against the mock prim.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: miri
      - name: miri (mock prim backend)
        run: cargo +nightly miri test -p rusty_alloc

  # wasm is a shipped target, so it gets a gate that EXECUTES rather than one
  # that only compiles: `cargo test` cannot run wasm32-unknown-unknown, so the
  # self-test is instantiated in a real VM under node.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: check core for wasm32
        run: cargo check -p rusty_alloc --target wasm32-unknown-unknown
      - name: build wasm self-test
        run: cargo build -p rusty_alloc-wasm --target wasm32-unknown-unknown --release
      - name: run self-test inside a WebAssembly VM
        run: node bench/wasm-selftest.mjs target/wasm32-unknown-unknown/release/rusty_alloc_wasm.wasm

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: build oracle arms
        run: bash oracle/build.sh
      # OS-NAMESPACED output: oracle/build.sh writes to out/<uname>/<arm> because
      # this repo is shared between Windows and WSL and a mixed-OS cmake cache in
      # one directory corrupts both builds.
      - name: oracle version gate
        run: |
          set -e
          out="oracle/out/$(uname -s | tr '[:upper:]' '[:lower:]')/mi"
          ls -la "$out"
          test -e "$out/libmimalloc.so"
