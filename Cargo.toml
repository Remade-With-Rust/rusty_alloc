[workspace]
resolver = "2"
members = [
    "crates/rusty_alloc",
    "crates/rusty_alloc_api",
    "crates/rusty_alloc_ffi",
    "crates/rusty_alloc_override",
    "crates/rusty_alloc_bench",
    "crates/rusty_alloc_wasm",
]

[workspace.package]
# 1.0.0: the API is frozen; changes follow semver from here. The allocator is
# complete and gated; the wall-clock half of the performance evidence still
# needs a quiet box, so only instruction-count claims are made (README says so).
#
# 1.0.0: API frozen. The 2026-08-20 optimization campaign (docs/opps.md)
# sharpened the per-op margins — calloc 0.95->0.82, realloc 0.79->0.76,
# big/large/mixed nudged down — on top of the 0.7.0 fast-path work, and the
# `use-protection-please` security audit reached 14/15 v1.0.0 gates with a
# time-bound owner waiver on H-27 (the 30-day fuzz soak, mechanism live,
# completes 2026-09-19). Every op of the per-op scan is at-or-below mimalloc
# except batch (a measured safe-Rust codegen floor, +0.8%); all three
# real-program arms and the full mimalloc-bench corpus run clean.
# 1.0.1 — patch. No API change. `free`'s fast path went 27 instructions to 21
# (mimalloc's is 25): the `used--` codegen floor `docs/opps.md` #6 recorded as
# unreachable from safe Rust is closed, the thread-id read is folded into its
# compare, and resolving a pointer to its page dropped from nine instructions
# to five on a per-slice owner table in the segment header. Allocator-only
# ratios against mimalloc on real programs moved lua 0.75->0.66, perl
# 0.95->0.83, sqlite 0.98->0.85; every op of the per-op scan is now BELOW
# mimalloc, batch included.
#
# 1.1.0 — MINOR, and minor rather than patch for exactly one reason: it adds a
# public item, `bins::is_aligned_to`. Nothing is removed or changed, so every
# 1.0.x user compiles unchanged. The new function is total — a non-power-of-two
# alignment returns `false`, the conservative answer at every call site — which
# is what makes it safe to expose. The other helpers this release introduced
# (`div_by_block_size`, `exact_div_by_block_size`) are deliberately
# `pub(crate)`: both carry preconditions and return a wrong value rather than
# diverging outside them, and that does not belong in a frozen public API.
#
# The release itself: **the allocator no longer divides.** Zero `div`/`idiv`,
# zero `divsd`/`divss`, zero 128-bit soft-division libcalls, and zero
# magic-multiply divisions by `size_of::<Page>()` — verified in the shipped
# object, not inferred from source. 60 `div` instructions removed in all.
# `docs/opps.md` #1 (`page_index`'s divide by 88, open since it was filed) is
# closed at ZERO header cost: `Page::area` already encodes the slice index and
# `SEGMENT_SLICE_SIZE` is 2^16, so the index is a shift — the spare-field the
# entry proposed was never needed. `free_general` went 148 instructions to 112
# and `usable_size_slow` 93 to 55 when the block-size division's four-arm match
# became a branchless reciprocal table.
#
# One latent defect fixed on the way: huge segments build their single page
# slot by hand and never wrote `Page::area`, so it held null. Nothing read it
# before; `page_index` and `unalign` both do now.
#
# Windows: the QPC tick-to-nanosecond conversion no longer calls `__udivti3`.
#
# Real-program numbers are UNCHANGED at the precision the README prints —
# lua 0.97, perl 0.99, sqlite 1.00 whole-program; 0.66/0.83/0.85 allocator-only
# — and all 13 per-op scans remain below mimalloc. This release is a
# code-size and cycle result that the instruction counter mostly cannot see;
# said plainly rather than dressed up.
version = "1.1.0"
edition = "2024"
# MSRV. Declared for the first time in 1.0.1 because this release genuinely
# needs it: `asm!` label blocks (`asm_goto`, stable 1.87) carry the free path's
# memory-destination decrement, and a let-chain needs 1.88. Without this an
# older toolchain fails with a syntax error instead of a version message.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/remade-with-rust/rusty_alloc"
# Portfolio convention (matches rusty_h264): homepage is Mata Network, the
# parent org, not the GitHub org.
homepage = "https://www.mata.network/"
authors = ["remade-with-rust"]
keywords = ["allocator", "malloc", "mimalloc", "memory", "no-std"]
categories = ["memory-management", "no-std", "development-tools"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(kani)"] }

# Lint policy (hardening gate H-15). `pedantic` and `nursery` are ENABLED at
# workspace level and the build is clean under them, because every group
# member we do not enforce is listed below WITH ITS REASON. That is the point
# of the exercise: ~95 additional lints are now enforced, and the ones we
# decline are a deliberate, readable list rather than an unexamined
# `#![allow(clippy::pedantic)]`.
#
# Measured 2026-08-19: switching both groups on raised 481 warnings across
# ~25 distinct lints. Every one was triaged into the table below.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# --- Declined: DOCUMENTATION STYLE ------------------------------------------
# This crate's docs deliberately read as prose explaining a mechanism (why a
# brick exists, what a measurement showed). These lints police house style in
# a way that fights that, and none of them can catch a defect.
doc_markdown = "allow"                  # 63x: backticks around identifiers in prose
too_long_first_doc_paragraph = "allow"  # 26x: our first paragraphs state a mechanism
missing_errors_doc = "allow"            # 26x: errors are documented in prose, not a section
missing_panics_doc = "allow"            # 13x
missing_safety_doc = "allow"            # covered far more strictly by undocumented_unsafe_blocks

# --- Declined: API SHAPE ----------------------------------------------------
must_use_candidate = "allow"            # 58x: `#[must_use]` is applied where IGNORING the
                                        # value is a BUG (the 0.4.0 UAF family), not everywhere
                                        # a value is returned - blanket use dilutes that signal
module_name_repetitions = "allow"       # 37x: `page::PageQueue` etc. mirror upstream mimalloc's
                                        # names on purpose; this is a 1:1 remake
missing_const_for_fn = "allow"          # 23x: const-ness is an API promise; adding it wholesale
                                        # freezes internals we still reshape per measurement

# --- Declined: NUMERIC CASTS — audited, bounded by construction -------------
# 2026-08-19: all 24 cast sites in the SHIPPED library code were read
# individually (H-17). Every one narrows a value bounded by a compile-time
# constant (HEADER_SLICES, SLICES_PER_SEGMENT=512, MAX_ARENAS) or an already
# sign-clamped option (`get(..).max(0)`). NONE narrows an untrusted length,
# which is the failure this lint family exists to catch, and the geometry
# bounds are additionally enforced by const asserts in `segment.rs`.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_ptr_alignment = "allow"            # allocator metadata IS the alignment authority

# --- Declined: STYLE PREFERENCES --------------------------------------------
option_if_let_else = "allow"            # nursery; `if let/else` reads better in unsafe blocks
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
explicit_iter_loop = "allow"
use_self = "allow"
many_single_char_names = "allow"        # `p`, `b`, `q` are the allocator's own vocabulary
too_many_lines = "allow"                # the segment/page state machines are cohesive
semicolon_if_nothing_returned = "allow"
iter_with_drain = "allow"
borrow_as_ptr = "allow"                 # `&raw` is used where it matters; this fires on tests
inline_always = "allow"                 # `#[inline(always)]` here is measured, not decorative

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = true            # symbols for profiling; strip at distribution, not here

[profile.bench-dist]    # distribution-shaped profile for A/B honesty checks
inherits = "release"
debug = false
