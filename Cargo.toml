[workspace]
resolver = "2"
members = [
    "crates/rusty_alloc",
    "crates/rusty_alloc_api",
    "crates/rusty_alloc_ffi",
    "crates/rusty_alloc_override",
    "crates/rusty_alloc_bench",
    "crates/rusty_alloc_wasm",
]

[workspace.package]
# 0.x: the API is not frozen. The allocator is complete and gated; parts of the
# performance EVIDENCE are not — the full mimalloc-bench corpus is still
# unmeasured, and RSS has two data points rather than a sweep. The README says
# so under "What is and isn't measured"; keep it there and current.
#
# 0.4.0, not 0.3.3: aarch64's first real execution turned up seven defects, and
# fixing them CHANGED PUBLIC API — `Heap::adopt_segment` now returns `bool`
# (ignoring it was the use-after-free) and `HeapBox` gained a `subproc` field.
# Under 0.x semver a breaking change bumps the minor.
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/remade-with-rust/rusty_alloc"
# Portfolio convention (matches rusty_h264): homepage is Mata Network, the
# parent org, not the GitHub org.
homepage = "https://www.mata.network/"
authors = ["remade-with-rust"]
keywords = ["allocator", "malloc", "mimalloc", "memory", "no-std"]
categories = ["memory-management", "no-std", "development-tools"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = true            # symbols for profiling; strip at distribution, not here

[profile.bench-dist]    # distribution-shaped profile for A/B honesty checks
inherits = "release"
debug = false
