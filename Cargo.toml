[workspace]
resolver = "2"
members = [
    "crates/rusty_alloc",
    "crates/rusty_alloc_api",
    "crates/rusty_alloc_ffi",
    "crates/rusty_alloc_override",
    "crates/rusty_alloc_bench",
    "crates/rusty_alloc_wasm",
]

[workspace.package]
# 0.x: the API is not frozen. The allocator is complete and gated; the
# wall-clock half of the performance evidence still needs a quiet box. The
# README says so under "What is and isn't measured"; keep it there and current.
#
# 0.7.0: the 2026-08-19 fast-path campaign (docs/LEDGER.md). Every operation
# of the per-op scan and all three real-program arms now measure at-or-below
# mimalloc on instructions retired; the full mimalloc-bench corpus and the
# 10-program real-world sweep run clean (correctness). Public API changed
# under 0.x rules: `page_push_local` returns the post-decrement count,
# `Heap::malloc_generic` is crate-visible, and the TLS slot's empty state is
# a sentinel rather than null.
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/remade-with-rust/rusty_alloc"
# Portfolio convention (matches rusty_h264): homepage is Mata Network, the
# parent org, not the GitHub org.
homepage = "https://www.mata.network/"
authors = ["remade-with-rust"]
keywords = ["allocator", "malloc", "mimalloc", "memory", "no-std"]
categories = ["memory-management", "no-std", "development-tools"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = true            # symbols for profiling; strip at distribution, not here

[profile.bench-dist]    # distribution-shaped profile for A/B honesty checks
inherits = "release"
debug = false
