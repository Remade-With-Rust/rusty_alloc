[package]
name = "rusty_alloc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rusty_alloc = { path = "../crates/rusty_alloc" }

# Passthrough so `cargo fuzz run corruption --features secure` reaches the
# allocator. The `corruption` target needs it: without it the free-list link
# check is not compiled in, and part 2 of that target (the false-positive
# hunt) has nothing to hunt in.
[features]
secure = ["rusty_alloc/secure"]
# Same reason, for the experimental bound-without-encoding arm: under
# `linkcheck` a FALSE POSITIVE is an abort, so pointing any target at this
# build turns every fuzz target into a false-positive hunt.
linkcheck = ["rusty_alloc/linkcheck"]
# Under `blockmap` a false positive is likewise an abort, so any target aimed
# at this build is a false-positive hunt for the liveness map.
blockmap = ["rusty_alloc/blockmap"]

# Standalone workspace: the fuzz crate needs nightly + libFuzzer and must not
# drag those requirements into the main workspace's Windows/stable builds.
[workspace]

[[bin]]
name = "alloc_ops"
path = "fuzz_targets/alloc_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xthread"
path = "fuzz_targets/xthread.rs"
test = false
doc = false
bench = false

# Points at the free-list link CHECK rather than at a workload. Run it with
# `--features secure`, or part 2 (the false-positive hunt) has no check to
# hunt for false positives in.
[[bin]]
name = "corruption"
path = "fuzz_targets/corruption.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
